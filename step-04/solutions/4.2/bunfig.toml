# Workshop bunfig: 10-day minimum dependency age (Shai-Hulud defense).
# Every step ships its own bunfig.toml — security defaults are not a thing
# you add at the end, they're a thing you start with.

[install]
# 10 days = 60 * 60 * 24 * 10 = 864000 seconds.
minimumReleaseAge = 864000
minimumReleaseAgeExcludes = []
